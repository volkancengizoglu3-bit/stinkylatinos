name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmBotInGen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FarmBotInGen.apk
          gh release create "$RELEASE_TAG" FarmBotInGen.apk \
            --title "FarmBotInGen $RELEASE_TAG" \
            --notes "Automated debug APK build from commit ${GITHUB_SHA}. Install for testing; this is not a Play Store-signed production release."
